name: Update Kalshi markets

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest Kalshi markets
        run: python3 scripts/fetch_kalshi.py

      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Kalshi markets snapshot"
          file_pattern: kalshi-markets.json
