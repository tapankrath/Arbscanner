name: Watch and alert

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check watchlist and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scripts/watch_and_alert.py

      - name: Commit watchlist state if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update watchlist state"
          file_pattern: watchlist-state.json
